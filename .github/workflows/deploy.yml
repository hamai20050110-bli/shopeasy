name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tim thu muc project
        id: proj
        run: |
          FILE=$(find . -maxdepth 2 -name pubspec.yaml -not -path "./.*" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "Khong tim thay pubspec.yaml"
            exit 1
          fi
          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Web & Install dependencies
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          flutter create . --platforms=web
          flutter pub get

      - name: Build Web
        working-directory: ${{ steps.proj.outputs.dir }}
        run: flutter build web --release --base-href "/shopeasy/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ steps.proj.outputs.dir }}/build/web
